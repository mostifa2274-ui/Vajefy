name: One-use rebuild text-scoped coach cases
on:
  push:
    branches: [codex/repair-loop-diagnosis-20261009]
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.repository == 'mostifa2274-ui/Vajefy' && startsWith(github.event.head_commit.message, '[rebuild-coach]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh text-only coach corpus and audio-linked assurance records
        run: |
          set -euo pipefail
          npm run coach:cases
          npm run assurance:records
          npm run validate:data
      - name: Commit generated evidence and remove one-use workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-use-rebuild-coach-20261009.yml
          git add -- content/coach-eval/cases.json content/assurance/records/A1.json
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "Refresh independent coach text version and exact assurance records"
          git push origin HEAD:codex/repair-loop-diagnosis-20261009
