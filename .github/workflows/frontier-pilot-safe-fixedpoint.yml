name: Finish pilot-safe frontier fixed point

on:
  push:
    branches: [codex/frontier-pilot-safe-apply-v2]
    paths:
      - ".github/workflows/frontier-pilot-safe-fixedpoint.yml"

permissions:
  contents: write

concurrency:
  group: frontier-pilot-safe-fixedpoint
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/frontier-pilot-safe-apply-v2
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply pilot-safe promotions to a bounded fixed point
        shell: bash
        run: |
          set -euo pipefail
          LAST=1
          for WAVE in $(seq 1 12); do
            OUTPUT="$(npm run -s assurance:frontier:promote -- --apply)"
            printf '%s\n' "$OUTPUT"
            MOVED="$(printf '%s\n' "$OUTPUT" | sed -n 's/^Pilot-safe frontier promotion: \([0-9][0-9]*\) movable.*/\1/p' | tail -1)"
            if [ -z "$MOVED" ]; then
              echo "Could not parse moved count from frontier promotion output." >&2
              exit 1
            fi
            echo "Frontier safe wave $WAVE moved $MOVED entr$( [ "$MOVED" -eq 1 ] && echo y || echo ies )."
            LAST="$MOVED"
            if [ "$MOVED" -eq 0 ]; then
              break
            fi
          done
          if [ "$LAST" -ne 0 ]; then
            echo "Pilot-safe frontier promotion did not reach a fixed point within 12 waves." >&2
            exit 1
          fi

      - name: Rebuild all affected deterministic artifacts
        run: |
          node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
          npm run assurance:records
          npm run assurance:scene-coverage
          npm run coach:cases
          npm run assurance:content:baseline

      - name: Verify deterministic assurance gates
        run: npm run validate:data

      - name: Commit only frontier fixed-point artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -- content/curriculum/A1.json content/compiled/enhanced.json content/assurance/records/A1.json content/assurance/scene-coverage.json content/assurance/deterministic-baseline.json content/coach-eval/cases.json public/data/enhanced-order.json public/data/enhanced

          UNEXPECTED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u | grep -v '^$' || true
          )"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected generated changes outside the frontier allowlist:" >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No additional fixed-point changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish pilot-safe frontier promotion fixed point"
          git push origin HEAD:codex/frontier-pilot-safe-apply-v2
