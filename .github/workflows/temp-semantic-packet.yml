name: Temporary semantic packet generation

on:
  push:
    branches:
      - codex/semantic-judge-packets

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/semantic-judge-packets
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Unit 1 semantic judge packet
        run: npm run assurance:semantic:packets
      - name: Commit packet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/assurance/semantic/packets/01-introductions.json
          if git diff --cached --quiet; then
            echo "Semantic packet already current."
            exit 0
          fi
          git commit -m "chore: generate Unit 1 semantic judge packet [skip packet]"
          git push origin HEAD:codex/semantic-judge-packets
