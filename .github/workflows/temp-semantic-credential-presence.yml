name: Temporary semantic credential presence

on:
  push:
    branches:
      - codex/semantic-credential-presence

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    env:
      ENGLISH_KEY: ${{ secrets.SEMANTIC_JUDGE_ENGLISH_API_KEY }}
      PERSIAN_KEY: ${{ secrets.SEMANTIC_JUDGE_PERSIAN_API_KEY }}
      PEDAGOGICAL_KEY: ${{ secrets.SEMANTIC_JUDGE_PEDAGOGICAL_API_KEY }}
      ADVERSARIAL_KEY: ${{ secrets.SEMANTIC_JUDGE_ADVERSARIAL_API_KEY }}
      CF_ACCOUNT: ${{ vars.SEMANTIC_JUDGE_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for item in \
            "SEMANTIC_JUDGE_ENGLISH_API_KEY:$ENGLISH_KEY" \
            "SEMANTIC_JUDGE_PERSIAN_API_KEY:$PERSIAN_KEY" \
            "SEMANTIC_JUDGE_PEDAGOGICAL_API_KEY:$PEDAGOGICAL_KEY" \
            "SEMANTIC_JUDGE_ADVERSARIAL_API_KEY:$ADVERSARIAL_KEY" \
            "SEMANTIC_JUDGE_CLOUDFLARE_ACCOUNT_ID:$CF_ACCOUNT"
          do
            name="${item%%:*}"
            value="${item#*:}"
            if [ -n "$value" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done
