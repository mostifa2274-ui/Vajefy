name: A1 Unit 6 readiness audit once

permissions:
  contents: read

on:
  push:
    branches:
      - codex/a1-unit6-heldout-readiness

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print Unit 6 missing-sense source context
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const wanted = new Set([
            "lex:A1:park#verb",
            "lex:A1:way#method",
            "lex:A1:right#direction",
            "lex:A1:right#now",
            "lex:A1:turn#noun",
            "lex:A1:up#preposition",
            "lex:A1:over#more-than",
            "lex:A1:down#preposition",
            "lex:A1:around#about",
            "lex:A1:floor#storey",
            "lex:A1:out#out-of",
            "lex:A1:close#near"
          ]);

          const dir = "content/pilot/entries";
          for (const name of fs.readdirSync(dir).filter((n) => n.endsWith(".json")).sort()) {
            const file = path.join(dir, name);
            const entries = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const entry of entries) {
              for (const sense of entry.senses ?? []) {
                if (!wanted.has(sense.id)) continue;
                console.log("SENSE_CONTEXT|" + JSON.stringify({
                  file,
                  entryId: entry.id,
                  headword: entry.headword,
                  sense: {
                    id: sense.id,
                    pos: sense.pos,
                    gloss: sense.gloss,
                    meaning: sense.meaning,
                    grammar: sense.grammar,
                    examples: sense.examples,
                    collocations: sense.collocations,
                    mistake: sense.mistake,
                    check: sense.check
                  }
                }));
              }
            }
          }
          NODE
