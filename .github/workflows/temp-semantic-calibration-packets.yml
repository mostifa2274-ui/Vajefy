name: Temporary semantic calibration packet generation

on:
  push:
    branches:
      - codex/semantic-judge-calibration

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/semantic-judge-calibration
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate frozen calibration
        run: npm run assurance:semantic:calibration:check
      - name: Build calibration packets
        run: npm run assurance:semantic:calibration:packets
      - name: Commit packets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/assurance/semantic/calibration/v1/packets
          if git diff --cached --quiet; then
            echo "Calibration packets already current."
            exit 0
          fi
          git commit -m "chore: generate frozen semantic calibration packets [skip calibration-packet]"
          git push origin HEAD:codex/semantic-judge-calibration
