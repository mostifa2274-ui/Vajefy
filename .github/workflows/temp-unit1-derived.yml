name: Temporary Unit 1 derived regeneration

on:
  push:
    branches:
      - codex/unit1-autonomous-certification

permissions:
  contents: write

jobs:
  regenerate-derived:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/unit1-autonomous-certification
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh version-bound derived artifacts
        shell: bash
        run: |
          npm run coach:cases
          node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/reference-notes.ts build
          node scripts/build-usefulness.mjs
      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/coach-eval/cases.json public/data/reference-reviewed.json public/data/usefulness.json
          if git diff --cached --quiet; then
            echo "Version-bound artifacts already current."
            exit 0
          fi
          git commit -m "chore: refresh Unit 1 version-bound artifacts [skip derived]"
          git push origin HEAD:codex/unit1-autonomous-certification
