name: Apply pilot-safe frontier batch

on:
  push:
    branches: [codex/frontier-pilot-safe-apply]
    paths:
      - ".github/workflows/frontier-apply-branch.yml"

permissions:
  contents: write

concurrency:
  group: frontier-pilot-safe-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/frontier-pilot-safe-apply
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply safe frontier promotions
        run: npm run assurance:frontier:promote -- --apply

      - name: Regenerate curriculum-dependent artifacts
        run: |
          npm run content:build
          npm run assurance:records
          npm run assurance:scene-coverage

      - name: Commit only allowlisted curriculum artifacts
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          UNEXPECTED="$(
            git status --porcelain | sed 's/^...//' | while read -r FILE; do
              case "$FILE" in
                content/curriculum/A1.json|                content/compiled/enhanced.json|                public/data/enhanced-order.json|                public/data/enhanced/*|                content/assurance/records/A1.json|                content/assurance/scene-coverage.json)
                  ;;
                *)
                  printf '%s\n' "$FILE"
                  ;;
              esac
            done
          )"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected generated changes:" >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi
          git add --             content/curriculum/A1.json             content/compiled/enhanced.json             public/data/enhanced-order.json             public/data/enhanced             content/assurance/records/A1.json             content/assurance/scene-coverage.json
          if git diff --cached --quiet; then
            echo "No pilot-safe frontier changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply pilot-safe frontier promotions"
          git push origin HEAD:codex/frontier-pilot-safe-apply
