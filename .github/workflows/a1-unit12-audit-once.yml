name: A1 Unit 12 audit once

permissions:
  contents: read

on:
  push:
    branches:
      - codex/a1-unit12-heldout-readiness

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print compact Unit 12 qualification evidence
        shell: bash
        run: |
          npm run --silent content:qualification -- --unit 12-help-everyday-problems --json > /tmp/unit12.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("/tmp/unit12.json", "utf8"));
          const unit = report.units[0];
          console.log("UNIT12_SUMMARY|" + JSON.stringify({
            assigned: unit.assignedEntries,
            target: unit.targetEntries,
            content: unit.evidence.content,
            heldOut: unit.evidence.heldOutAssessment,
            audio: unit.evidence.audio,
            review: unit.evidence.review,
            machineReady: unit.machineReadyForReview,
            blockers: unit.blockers,
            nextActions: unit.nextActions,
          }));
          for (const sense of unit.evidence.heldOutAssessment.missingSenses) {
            console.log("MISSING_SENSE|" + sense);
          }
          NODE
