name: Semantic judge calibration and qualification

# Unattended under content/assurance/semantic/automation.json. Each run, the
# planner picks at most one pre-registered free Workers AI candidate whose
# frozen v1 campaign fits what is left of the day's free Neuron ceiling, then
# qualifies or rejects it, or logs a failed attempt, and commits the outcome
# to main. See content/assurance/semantic/AUTOMATION.md.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      role:
        description: Role to calibrate; auto lets the planner choose
        required: true
        type: choice
        default: auto
        options:
          - auto
          - english
          - persian
          - pedagogical
          - adversarial

permissions:
  contents: write
  id-token: write

concurrency:
  group: semantic-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SEMANTIC_JUDGE_TRANSPORT: keyless
      ROLE_INPUT: ${{ inputs.role || 'auto' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Plan without network or inference
        id: first
        run: npm run assurance:semantic:automation -- plan --role "$ROLE_INPUT" --github-output

      - name: Re-verify Workers AI rates
        id: rates
        if: ${{ steps.first.outputs.action == 'calibrate' }}
        run: npm run assurance:semantic:rates:refresh -- --github-output

      - name: Re-plan on verified rates
        id: plan
        if: ${{ steps.first.outputs.action == 'calibrate' }}
        run: npm run assurance:semantic:automation -- plan --role "$ROLE_INPUT" --github-output

      - name: Verify current zero-cost calibration budget
        if: ${{ steps.plan.outputs.action == 'calibrate' }}
        run: npm run assurance:semantic:budget:current

      - name: Keyless no-inference gateway preflight
        if: ${{ steps.plan.outputs.action == 'calibrate' }}
        env:
          ROLE: ${{ steps.plan.outputs.role }}
        run: npm run assurance:semantic:keyless:preflight -- --role "$ROLE"

      # Write-ahead: the campaign's full Neuron bound is charged on main before
      # any inference, so a run that later fails to record cannot hide its
      # usage from the next run. No push, no inference.
      - name: Reserve the campaign on main before inference
        if: ${{ steps.plan.outputs.action == 'calibrate' }}
        shell: bash
        env:
          ROLE: ${{ steps.plan.outputs.role }}
          NEURONS: ${{ steps.plan.outputs.neurons }}
        run: |
          set -euo pipefail
          npm run assurance:semantic:automation -- reserve \
            --run-id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --role "$ROLE" \
            --neurons "$NEURONS"
          scripts/semantic-calibration-commit.sh "$ROLE" \
            "Semantic calibration: reserve ${ROLE} (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})"

      - name: Run three isolated calibration repeats
        id: repeats
        if: ${{ steps.plan.outputs.action == 'calibrate' }}
        timeout-minutes: 45
        continue-on-error: true
        shell: bash
        env:
          ROLE: ${{ steps.plan.outputs.role }}
        run: |
          set -uo pipefail
          PACKET="content/assurance/semantic/calibration/v1/packets/${ROLE}.json"
          test -f "$PACKET"
          for REPEAT in 1 2 3; do
            ATTEMPT="calibration-attempt-${ROLE}-${REPEAT}.json"
            # Marks the repeat as started; the runner overwrites it with what it spent.
            echo '{"status":"started"}' > "$ATTEMPT"
            if ! npm run assurance:semantic:judge -- \
              --role "$ROLE" \
              --packet "$PACKET" \
              --run-id "cal-v1-${ROLE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${REPEAT}" \
              --output "calibration-${ROLE}-${REPEAT}.json" \
              --attempt-output "$ATTEMPT"; then
              echo "Repeat ${REPEAT} failed; the remaining repeats are skipped to save the allocation."
              exit 1
            fi
          done

      - name: Record the outcome and activate the next judges
        id: record
        if: ${{ !cancelled() && steps.repeats.outcome != 'skipped' && steps.plan.outputs.action == 'calibrate' }}
        shell: bash
        env:
          ROLE: ${{ steps.plan.outputs.role }}
        run: |
          set -euo pipefail
          ARGS=(
            --role "$ROLE"
            --run-id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            --report "calibration-report-${ROLE}.json"
            --github-output
          )
          for REPEAT in 1 2 3; do
            ARGS+=(--run "calibration-${ROLE}-${REPEAT}.json")
            ARGS+=(--attempt "calibration-attempt-${ROLE}-${REPEAT}.json")
          done
          npm run assurance:semantic:automation -- record "${ARGS[@]}"

      - name: Commit only automation records
        if: ${{ always() && steps.first.outputs.action == 'calibrate' }}
        shell: bash
        env:
          ROLE: ${{ steps.plan.outputs.role }}
          OUTCOME: ${{ steps.record.outputs.outcome }}
          RECORD: ${{ steps.record.outcome }}
        run: |
          set -euo pipefail
          if [ "$RECORD" = "failure" ]; then
            # Keep the reservation already on main; drop partial writes.
            git checkout -- content/assurance/semantic
            git clean -fdq -- content/assurance/semantic
          fi
          scripts/semantic-calibration-commit.sh "$ROLE" \
            "Semantic calibration: ${ROLE:-rates} ${OUTCOME:-updated} (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})"

      - name: Upload calibration evidence
        if: ${{ always() && steps.repeats.outcome != 'skipped' && steps.plan.outputs.action == 'calibrate' }}
        uses: actions/upload-artifact@v4
        with:
          name: semantic-calibration-${{ steps.plan.outputs.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            calibration-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run on a gateway fault
        if: ${{ steps.record.outputs.failure_kind == 'gateway' }}
        run: |
          echo "The gateway, not the model, failed. The attempt is logged and will be retried; nothing was rejected." >&2
          exit 1
