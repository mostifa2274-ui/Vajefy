name: Frontier evidence sync

permissions:
  contents: write

on:
  push:
    branches: [codex/frontier-safe-batch1]

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[frontier-evidence-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/frontier-safe-batch1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate deterministic curriculum-dependent evidence
        run: |
          set -euo pipefail
          npm run coach:cases
          npm run assurance:records
          npm run assurance:scene-coverage
      - name: Commit exact evidence outputs
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- content/coach-eval/cases.json content/assurance/records/A1.json content/assurance/scene-coverage.json)"
          if [ -z "$changed" ]; then
            echo "Curriculum-dependent evidence already current."
            exit 0
          fi
          printf '%s\n' "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/coach-eval/cases.json content/assurance/records/A1.json content/assurance/scene-coverage.json
          git commit -m "[frontier-evidence-bot] Refresh curriculum assurance evidence"
          git push origin HEAD:codex/frontier-safe-batch1
