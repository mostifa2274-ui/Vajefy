name: A1 Unit 5 readiness audit once

permissions:
  contents: read

on:
  push:
    branches:
      - codex/a1-unit5-heldout-readiness

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print Unit 5 qualification gaps
        shell: bash
        run: |
          npm run --silent content:qualification -- --unit 05-shopping-money --json > /tmp/unit5.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("/tmp/unit5.json", "utf8"));
          const unit = report.units[0];
          console.log("UNIT5_SUMMARY|" + JSON.stringify({
            assigned: unit.assignedEntries,
            target: unit.targetEntries,
            machineReady: unit.machineReadyForReview,
            blockers: unit.blockers,
            nextActions: unit.nextActions,
            content: unit.evidence.content,
            heldOut: unit.evidence.heldOutAssessment,
            audio: unit.evidence.audio,
            review: unit.evidence.review,
            release: {
              releasedEntries: unit.evidence.release.releasedEntries,
              complete: unit.evidence.release.complete
            }
          }));
          for (const sense of unit.evidence.heldOutAssessment.missingSenses) {
            console.log("MISSING_SENSE|" + sense);
          }
          for (const entry of unit.evidence.audio.incompleteEntries) {
            console.log("INCOMPLETE_AUDIO|" + entry);
          }
          NODE
