name: Regenerate lint lockfile

permissions:
  contents: write

on:
  push:
    branches: [chatgpt/eslint10-tooling-20261002]

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/eslint10-tooling-20261002
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for ESLint 10"
          git push origin HEAD:chatgpt/eslint10-tooling-20261002
