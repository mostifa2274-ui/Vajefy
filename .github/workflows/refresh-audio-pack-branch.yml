name: Refresh audio pack branch artifact

on:
  push:
    branches: [codex/audio-unit-packs-v2]
    paths:
      - "scripts/build-content.ts"
      - "src/lib/learn/content.ts"
      - ".github/workflows/refresh-audio-pack-branch.yml"

permissions:
  contents: write

concurrency:
  group: refresh-audio-pack-branch
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/audio-unit-packs-v2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild generated content
        run: node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
      - name: Commit only the runtime audio pack manifest
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain)"
          expected=" M public/data/enhanced/audio-pack.json"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected generated changes:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git add -- public/data/enhanced/audio-pack.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate public unit audio pack manifest"
          git push origin HEAD:codex/audio-unit-packs-v2
