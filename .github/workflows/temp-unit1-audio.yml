name: Temporary Unit 1 audio regeneration

on:
  push:
    branches:
      - codex/unit1-autonomous-certification

permissions:
  contents: write

jobs:
  regenerate-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/unit1-autonomous-certification
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/audio/requirements.txt
      - run: npm ci
      - name: Install audio dependencies
        run: pip install -r scripts/audio/requirements.txt
      - name: Download pinned Kokoro model assets
        shell: bash
        run: |
          mkdir -p .audio-models
          curl --fail --location --retry 3 --output .audio-models/kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl --fail --location --retry 3 --output .audio-models/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Build current content before synthesis
        run: node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
      - name: Generate missing controlled audio
        run: python scripts/audio/generate_audio.py --models .audio-models
      - name: Rebuild content with new controlled clips
        run: node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
      - name: Commit audio and derived content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pilot/audio-manifest.json content/pilot/audio-report.json
          git add -A public/audio/pilot
          git add content/compiled/enhanced.json public/data/enhanced public/data/enhanced-order.json
          if git diff --cached --quiet; then
            echo "Audio and derived content already current."
            exit 0
          fi
          git commit -m "chore: regenerate Unit 1 controlled audio [skip audio]"
          git push origin HEAD:codex/unit1-autonomous-certification
