name: Apply pilot-safe frontier batch

on:
  push:
    branches: [codex/frontier-pilot-safe-apply-v2]
    paths:
      - ".github/workflows/frontier-pilot-safe-apply.yml"
      - "content/curriculum/A1.json"
      - "scripts/frontier-promote.ts"
      - "scripts/frontier-repair.ts"
      - "scripts/content-assurance.ts"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: frontier-pilot-safe-apply-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/frontier-pilot-safe-apply-v2
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply prerequisite-safe frontier promotions
        run: npm run assurance:frontier:promote -- --apply

      - name: Rebuild all affected deterministic artifacts
        run: |
          node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
          npm run assurance:records
          npm run assurance:scene-coverage
          npm run coach:cases

      - name: Verify deterministic assurance gates
        run: npm run validate:data

      - name: Commit only frontier batch artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add --             content/curriculum/A1.json             content/compiled/enhanced.json             content/assurance/records/A1.json             content/assurance/scene-coverage.json             content/coach-eval/cases.json             public/data/enhanced-order.json             public/data/enhanced

          UNEXPECTED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u | grep -v '^$' || true
          )"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected generated changes outside the frontier allowlist:" >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No frontier batch changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply pilot-safe frontier promotion batch"
          git push origin HEAD:codex/frontier-pilot-safe-apply-v2
