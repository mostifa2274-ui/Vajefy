name: Audio certification

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "public/audio/pilot/**"
      - "content/pilot/audio-manifest.json"
      - "content/pilot/audio-report.json"
      - "content/compiled/enhanced.json"
      - "content/curriculum/A1.json"
      - "content/assurance/audio/repair-policy.json"
      - "src/lib/learn/audio-assurance.ts"
      - "src/lib/learn/audio-source-scope.ts"
      - "scripts/audio-certification.ts"
      - "scripts/audio-source-hashes.ts"
      - "scripts/audio-repair-plan.ts"
      - "scripts/audio-repair-evaluate.ts"
      - "scripts/audio/certify_audio.py"
      - "scripts/audio/generate_repair_candidates.py"
      - "scripts/audio/promote_repair_candidates.py"
      - "scripts/audio/rollback_unstable_promotions.py"
      - "scripts/audio/requirements-certify.txt"
      - "scripts/audio-certification-commit.sh"
      - "scripts/check-audio-certify-workflow.ts"
      - ".github/workflows/audio-certify.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-certification
  cancel-in-progress: false

jobs:
  certify:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[audio-bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VOSK_ARCHIVE_SHA256: 30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498
      KOKORO_MODEL_SHA256: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
      KOKORO_VOICES_SHA256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/audio/requirements-certify.txt

      - run: npm ci

      - name: Decide whether certification needs a retry
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          RUN=true
          REASON=invalid-or-stale
          if npm run -s assurance:audio:check; then
            STATUS="$(node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("content/assurance/audio/certificates.json","utf8")); process.stdout.write(c.status);')"
            if [ "$STATUS" = "PENDING_RECOGNITION" ]; then
              REASON=pending-recognition
            elif [ "$STATUS" = "PARTIAL" ]; then
              mkdir -p .audio-repair
              npm run -s assurance:audio:repair:plan -- --output .audio-repair/preflight-plan.json
              COUNT="$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(".audio-repair/preflight-plan.json","utf8")); process.stdout.write(String(p.items.length));')"
              if [ "$COUNT" -gt 0 ]; then
                REASON=partial-with-untried-candidates
              else
                RUN=false
                REASON=current-PARTIAL-no-untried-candidates
              fi
            else
              RUN=false
              REASON=current-"$STATUS"
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Audio certification plan: run=$RUN reason=$REASON"

      - name: Build scoped Unit 1-3 source identity
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: npm run -s assurance:audio:scope -- --output .audio-repair/source-hashes.json

      - name: Install offline recognition and synthesis dependencies
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          python -m pip install --disable-pip-version-check -r scripts/audio/requirements-certify.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip

      - name: Restore Whisper model cache
        if: ${{ steps.plan.outputs.run == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: audio-whisper-small-en-4e49ce629e3fa4c3da596c602b212cb026910443

      - name: Download and verify Vosk model
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          wget -q --https-only \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -O /tmp/vosk-model-small-en-us-0.15.zip
          echo "${VOSK_ARCHIVE_SHA256}  /tmp/vosk-model-small-en-us-0.15.zip" | sha256sum -c -
          rm -rf /tmp/vosk-model-small-en-us-0.15
          unzip -q /tmp/vosk-model-small-en-us-0.15.zip -d /tmp
          test -f /tmp/vosk-model-small-en-us-0.15/am/final.mdl

      - name: Download and verify Kokoro repair model
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kokoro
          wget -q --https-only \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx \
            -O /tmp/kokoro/kokoro-v1.0.onnx
          wget -q --https-only \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin \
            -O /tmp/kokoro/voices-v1.0.bin
          echo "${KOKORO_MODEL_SHA256}  /tmp/kokoro/kokoro-v1.0.onnx" | sha256sum -c -
          echo "${KOKORO_VOICES_SHA256}  /tmp/kokoro/voices-v1.0.bin" | sha256sum -c -

      - name: Certify current Unit 1-3 audio
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          python scripts/audio/certify_audio.py \
            --vosk-model /tmp/vosk-model-small-en-us-0.15 \
            --vosk-archive /tmp/vosk-model-small-en-us-0.15.zip \
            --source-hashes .audio-repair/source-hashes.json
          npm run assurance:audio -- --write

      - name: Snapshot scoped release before repair promotion
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          python scripts/audio/rollback_unstable_promotions.py snapshot \
            --snapshot-dir .audio-repair/baseline

      - name: Run bounded candidate repair loop
        if: ${{ steps.plan.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audio-repair
          for ROUND in 1 2 3 4; do
            echo "Audio repair round ${ROUND}"
            npm run -s assurance:audio:repair:plan -- --output .audio-repair/plan.json
            COUNT="$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(".audio-repair/plan.json","utf8")); process.stdout.write(String(p.items.length));')"
            if [ "$COUNT" -eq 0 ]; then
              echo "No repairable untried candidates remain."
              break
            fi

            rm -rf .audio-repair/candidates
            mkdir -p .audio-repair/candidates
            python scripts/audio/generate_repair_candidates.py \
              --models /tmp/kokoro \
              --plan .audio-repair/plan.json \
              --out-dir .audio-repair/candidates \
              --output .audio-repair/candidates.json

            python scripts/audio/certify_audio.py \
              --vosk-model /tmp/vosk-model-small-en-us-0.15 \
              --vosk-archive /tmp/vosk-model-small-en-us-0.15.zip \
              --source-hashes .audio-repair/source-hashes.json \
              --candidate-manifest .audio-repair/candidates.json \
              --candidate-root .audio-repair/candidates \
              --output .audio-repair/candidate-recognition.json

            npm run -s assurance:audio:repair:evaluate -- \
              --candidates .audio-repair/candidates.json \
              --recognition .audio-repair/candidate-recognition.json \
              --output .audio-repair/result.json

            python scripts/audio/promote_repair_candidates.py \
              --candidates .audio-repair/candidates.json \
              --result .audio-repair/result.json \
              --candidate-root .audio-repair/candidates

            node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
          done

      - name: Re-certify exact promoted state
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
          # Promotions change the shipped manifest/MP3 bytes. Rebuild the
          # scoped identity from that exact promoted state before recognition.
          npm run -s assurance:audio:scope -- --output .audio-repair/source-hashes.json
          python scripts/audio/certify_audio.py \
            --vosk-model /tmp/vosk-model-small-en-us-0.15 \
            --vosk-archive /tmp/vosk-model-small-en-us-0.15.zip \
            --source-hashes .audio-repair/source-hashes.json
          npm run assurance:audio -- --write

      - name: Roll back final-pass-unstable promotions
        if: ${{ steps.plan.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .audio-repair/rollback-applied
          python scripts/audio/rollback_unstable_promotions.py rollback \
            --snapshot-dir .audio-repair/baseline \
            --changed-marker .audio-repair/rollback-applied
          if [ -f .audio-repair/rollback-applied ]; then
            echo "Rollback changed release bytes; rebuilding exact shipped state."
            node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
            npm run -s assurance:audio:scope -- --output .audio-repair/source-hashes.json
            python scripts/audio/certify_audio.py \
              --vosk-model /tmp/vosk-model-small-en-us-0.15 \
              --vosk-archive /tmp/vosk-model-small-en-us-0.15.zip \
              --source-hashes .audio-repair/source-hashes.json
            npm run assurance:audio -- --write
          else
            echo "No final-pass rollback required."
          fi

      - name: Validate exact evidence and promotions
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          npm run assurance:audio:check
          npm run assurance:audio:repair:check
          node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts --check

      - name: Commit only audio assurance artifacts
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          bash scripts/audio-certification-commit.sh \
            "[audio-bot] Audio assurance: certify and repair Unit 1-3 (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})"

      - name: Upload certification and repair evidence
        if: ${{ always() && steps.plan.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: audio-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            content/assurance/audio/recognition.json
            content/assurance/audio/certificates.json
            content/assurance/audio/repair-log.json
            .audio-repair/source-hashes.json
            .audio-repair/plan.json
            .audio-repair/candidates.json
            .audio-repair/candidate-recognition.json
            .audio-repair/result.json
            .audio-repair/rollback-applied
            .audio-repair/baseline/certificates.json
            .audio-repair/baseline/audio-manifest.json
            .audio-repair/baseline/audio-report.json
          if-no-files-found: warn
          retention-days: 30

      # Evidence and any independently certified promotions are recorded even
      # when unresolved targets remain. The release gate stays red until every
      # Unit 1-3 word/accent pair is certified.
      - name: Enforce Unit 1-3 audio gate
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: npm run assurance:audio:strict

      - name: Record automation outcome on main
        if: ${{ always() && steps.plan.outputs.run == 'true' }}
        shell: bash
        env:
          AUDIO_AUTOMATION_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          # Any uncommitted partial mutations were already captured by the
          # artifact upload. Keep only evidence that reached a bot commit.
          git reset --hard HEAD
          # build-content may have created content-hashed part files while
          # evaluating promoted audio. They are untracked after reset and must
          # not poison the fail-closed evidence commit check.
          git clean -fdq -- .audio-repair public/data/enhanced
          npm run assurance:audio -- --record-automation
          bash scripts/audio-certification-commit.sh \
            "[audio-bot] Audio assurance automation outcome (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})"
