name: Frontier generated content sync

permissions:
  contents: write

on:
  push:
    branches: [codex/frontier-safe-batch1]

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[frontier-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/frontier-safe-batch1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild generated learning content
        run: node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
      - name: Commit exact generated outputs
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- content/compiled/enhanced.json public/data/enhanced public/data/enhanced-order.json)"
          if [ -z "$changed" ]; then
            echo "Generated learning content already current."
            exit 0
          fi
          printf '%s\n' "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content/compiled/enhanced.json public/data/enhanced public/data/enhanced-order.json
          git commit -m "[frontier-bot] Refresh generated learning content"
          git push origin HEAD:codex/frontier-safe-batch1
