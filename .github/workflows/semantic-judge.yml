name: Semantic judge (manual)

on:
  workflow_dispatch:
    inputs:
      role:
        description: Independent judge role to run
        required: true
        type: choice
        options:
          - english
          - persian
          - pedagogical
          - adversarial
      target_set:
        description: Calibration must be passed before Unit 1 judging
        required: true
        type: choice
        options:
          - calibration_v1
          - unit1
      run_id:
        description: Stable run identifier recorded in evidence provenance
        required: true
        type: string
      acknowledge_inference:
        description: I explicitly authorize this free-allocation inference run
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  judge:
    if: ${{ github.ref == 'refs/heads/main' && inputs.acknowledge_inference }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMANTIC_JUDGE_TRANSPORT: keyless

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Select judge packet
        shell: bash
        env:
          ROLE: ${{ inputs.role }}
          TARGET_SET: ${{ inputs.target_set }}
        run: |
          set -euo pipefail
          case "$TARGET_SET" in
            calibration_v1)
              PACKET="content/assurance/semantic/calibration/v1/packets/${ROLE}.json"
              ;;
            unit1)
              PACKET="content/assurance/semantic/packets/01-introductions.json"
              ;;
            *)
              echo "Unsupported target set: $TARGET_SET" >&2
              exit 1
              ;;
          esac
          echo "SEMANTIC_PACKET=$PACKET" >> "$GITHUB_ENV"

      - name: Check role qualification before Unit 1
        if: ${{ inputs.target_set == 'unit1' }}
        env:
          ROLE: ${{ inputs.role }}
        run: npm run assurance:semantic:qualification:check -- --role "$ROLE"

      - name: Keyless no-inference gateway preflight
        env:
          ROLE: ${{ inputs.role }}
        run: npm run assurance:semantic:keyless:preflight -- --role "$ROLE"

      - name: Run isolated semantic judge
        env:
          ROLE: ${{ inputs.role }}
          RUN_ID: ${{ inputs.run_id }}
          TARGET_SET: ${{ inputs.target_set }}
        run: |
          npm run assurance:semantic:judge -- \
            --role "$ROLE" \
            --packet "$SEMANTIC_PACKET" \
            --run-id "$RUN_ID-${GITHUB_RUN_ID}" \
            --output "semantic-${TARGET_SET}-${ROLE}.json"

      - name: Upload structured role evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-${{ inputs.target_set }}-${{ inputs.role }}-${{ github.run_id }}
          path: semantic-${{ inputs.target_set }}-${{ inputs.role }}.json
          if-no-files-found: error
          retention-days: 30
