name: One-use complete legacy Oxford/ChatGPT authoring inventory
on:
  push:
    branches: [codex/gate0-full-5322-word-authorship-map-20261009]
permissions:
  contents: write
jobs:
  generate:
    if: ${{ github.repository == 'mostifa2274-ui/Vajefy' && startsWith(github.event.head_commit.message, '[generate-full-rights-inventory]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate all lexical, supplement and A1 teaching source-lineage rows
        run: |
          set -euo pipefail
          npm run assurance:rights:authorship -- --write
          npm run assurance:rights:authorship
          npm run validate:data
      - name: Commit full SHA-256-bound reports and remove one-use workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-use-full-rights-inventory.yml
          git add -- content/rights-staging/legacy-full-lineage/
          git diff --cached --quiet && { echo "Expected generated rights mapping not committed"; exit 1; }
          git commit -m "Record complete 5322+2950 legacy catalogue and ChatGPT authorship reports"
          git push origin HEAD:codex/gate0-full-5322-word-authorship-map-20261009
