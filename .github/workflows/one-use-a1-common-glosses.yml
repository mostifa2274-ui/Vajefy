name: One-use A1 common-word frontier gloss rebuild
on:
  push:
    branches: [codex/a1-common-word-glosses-20261008]
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.repository == 'mostifa2274-ui/Vajefy' && startsWith(github.event.head_commit.message, '[start-gloss-batch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply only pre-reviewed, structurally safe, later-unit glosses
        run: |
          set -euo pipefail
          node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/frontier-safe-gloss-batch.ts --apply
      - name: Rebuild provenance, exact derived content and all ratchets
        run: |
          set -euo pipefail
          npm run content:build
          npm run coach:cases
          npm run content:provenance -- --generator chatgpt-2026-10-08-frontier-common-glosses
          npm run assurance:records
          npm run assurance:content:baseline
          npm run assurance:scene-coverage
          npm run validate:data
      - name: Commit evidence and remove this one-use workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-use-a1-common-glosses.yml
          git add -A --             content/pilot/entries             content/assurance/deterministic-baseline.json             content/assurance/records/A1.json             content/assurance/generation.json             content/assurance/scene-coverage.json             content/compiled/enhanced.json             content/coach-eval/cases.json             public/data/enhanced             public/data/enhanced-order.json
          git diff --cached --quiet && { echo "No source repair files changed"; exit 1; }
          git commit -m "A1: apply context-checked common-word frontier glosses"
          git push origin HEAD:codex/a1-common-word-glosses-20261008
