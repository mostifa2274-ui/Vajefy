name: A1 language audit once

permissions:
  contents: read

on:
  push:
    branches:
      - codex/a1-teaching-copy-cleanup

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print compact unresolved A1 calibration language
        shell: bash
        run: |
          npm run --silent content:calibration -- --json > /tmp/a1-calibration.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const packet = JSON.parse(fs.readFileSync("/tmp/a1-calibration.json", "utf8"));
          console.log(`SUMMARY|${packet.summary.languageUnresolved}|${packet.summary.taskLanguageUnresolved}|${packet.summary.pairedTeachingScaffolded}|${packet.summary.taskLanguageScaffolded}`);
          for (const entry of packet.entries) {
            const deps = entry.language.dependencies.filter(
              (item) => !["scaffold", "paired-scaffold", "exception"].includes(item.status),
            );
            if (!deps.length) continue;
            const encoded = deps.map((item) =>
              `${item.token}~${item.status}~${item.entryId ?? ""}~${item.sources.join(",")}`
            ).join(";");
            console.log(`ENTRY|${entry.id}|${entry.headword}|${deps.length}|${encoded}`);
          }
          NODE
