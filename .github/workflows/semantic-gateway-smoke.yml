name: Keyless semantic gateway smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: keyless-semantic-gateway-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: content/assurance/semantic/keyless-provider-presets.json
          sparse-checkout-cone-mode: false

      - name: Wait for exact production revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_SHA:0:12}"
          URL="https://vajefy.mostifa2273.workers.dev/api/version"

          for ATTEMPT in $(seq 1 60); do
            BODY="$(curl -fsS --max-time 20 "$URL" || true)"
            REVISION="$(node -e 'try{const x=JSON.parse(process.argv[1]||"{}");process.stdout.write(x.revision||"")}catch{}' "$BODY")"
            if [ "$REVISION" = "$EXPECTED" ]; then
              echo "Production revision matches $EXPECTED."
              exit 0
            fi
            sleep 10
          done

          echo "Production did not reach exact revision $EXPECTED." >&2
          exit 1

      - name: Verify authenticated keyless gateway contract without inference
        shell: bash
        run: |
          set -euo pipefail

          REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          REQUEST_TOKEN="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -n "$REQUEST_URL"
          test -n "$REQUEST_TOKEN"

          SEP='?'
          case "$REQUEST_URL" in
            *\?*) SEP='&' ;;
          esac

          RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer $REQUEST_TOKEN" \
            -H "Accept: application/json" \
            "${REQUEST_URL}${SEP}audience=vajefy-semantic-gateway")"
          TOKEN="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)' "$RESPONSE")"
          echo "::add-mask::$TOKEN"

          BODY="$(curl -fsS --max-time 20 \
            -H "Authorization: Bearer $TOKEN" \
            https://vajefy.mostifa2273.workers.dev/api/internal/semantic-judge)"

          node - "$BODY" <<'NODE'
          const body = JSON.parse(process.argv[2]);
          if (body.ok !== true) throw new Error("gateway not ok");
          if (body.transport !== "cloudflare-workers-ai-binding") {
            throw new Error("unexpected transport");
          }
          // The deployed allowlist must be exactly the pre-registered candidates.
          const presets = JSON.parse(
            require("node:fs").readFileSync("content/assurance/semantic/keyless-provider-presets.json", "utf8"),
          );
          for (const [role, registered] of Object.entries(presets.candidates)) {
            const candidates = body.candidates?.[role];
            const expected = registered.map(({ provider, modelFamily, model, modelVersion, maxTokens }) => ({
              provider,
              modelFamily,
              model,
              modelVersion,
              maxTokens,
            }));
            if (JSON.stringify(candidates) !== JSON.stringify(expected)) {
              throw new Error(`${role} candidate allowlist mismatch`);
            }
            for (const candidate of candidates) {
              if (candidate.provider !== "cloudflare-workers-ai" || !String(candidate.model).startsWith("@cf/")) {
                throw new Error(`${role} candidate is not a Cloudflare-hosted model`);
              }
            }
          }
          console.log("Authenticated keyless gateway contract: PASS (no inference).");
          NODE
