name: Temporary Unit 1 content regeneration

on:
  push:
    branches:
      - codex/unit1-autonomous-certification

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/unit1-autonomous-certification
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild enhanced learning content
        run: node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
      - name: Commit generated content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/compiled/enhanced.json public/data/enhanced public/data/enhanced-order.json
          if git diff --cached --quiet; then
            echo "Generated content already current."
            exit 0
          fi
          git commit -m "chore: regenerate Unit 1 learning content [skip regen]"
          git push origin HEAD:codex/unit1-autonomous-certification
