name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build


  browser:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 3



  workers-build-contract:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:workers-build



  regenerate-tooling-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/eslint10-accessibility-20261002'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/eslint10-accessibility-20261002
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit canonical lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for ESLint 10 peers"
          git push origin HEAD:chatgpt/eslint10-accessibility-20261002
