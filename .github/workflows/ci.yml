name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build


  browser:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
