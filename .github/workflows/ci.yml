name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full commit history without old trees or blobs, so the status
          # ledger can verify the commits it records.
          fetch-depth: 0
          filter: tree:0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the status ledger against git history
        run: npm run status:check -- --require-history
      - name: Rebuild generated learning content
        run: node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
      - name: Upload generated learning content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-learning-content
          path: |
            content/compiled/enhanced.json
            public/data/enhanced
            public/data/enhanced-order.json
          if-no-files-found: error
          retention-days: 3
      - name: Verify generated learning content is committed
        shell: bash
        run: |
          changed="$(git status --porcelain -- content/compiled/enhanced.json public/data/enhanced public/data/enhanced-order.json)"
          if [ -n "$changed" ]; then
            echo "Generated learning content is out of date. Download the generated-learning-content artifact and commit it."
            printf '%s\n' "$changed"
            exit 1
          fi
      - run: npm run validate:data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build


  browser:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 3



  workers-build-contract:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:workers-build



