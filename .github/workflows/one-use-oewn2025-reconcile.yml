name: One-use reconcile independent WordNet staging evidence
on:
  push:
    branches: [codex/oewn2025-independent-candidate-intake-20261008]
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.repository == 'mostifa2274-ui/Vajefy' && startsWith(github.event.head_commit.message, '[start-oewn-reconcile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh stale machine evidence after incoming audio publication
        run: |
          set -euo pipefail
          npm run coach:cases
          npm run assurance:records
          npm run validate:data
          npm run assurance:rights:source:test
          node -e 'const x=require("./content/rights-staging/oewn-2025-candidates.json");if(x.candidateCount!==250||x.status!=="STAGING_ONLY_UNREVIEWED_NOT_RELEASE_CLEARED")process.exit(1)'
      - name: Commit only generated evidence and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OTHER="$(git diff --name-only | grep -Ev '^(content/coach-eval/cases[.]json|content/assurance/records/A1[.]json)$' || true)"
          if [ -n "$OTHER" ]; then
            echo "Unexpected modifications outside two generated evidence files" >&2
            printf '%s\n' "$OTHER" >&2
            exit 1
          fi
          git rm -- .github/workflows/one-use-oewn2025-reconcile.yml
          git add -- content/coach-eval/cases.json content/assurance/records/A1.json
          git diff --cached --quiet && { echo 'No generated evidence or workflow deletion'; exit 1; }
          git commit -m 'Rebuild exact coach and assurance evidence after audio publication'
          git push origin HEAD:codex/oewn2025-independent-candidate-intake-20261008
