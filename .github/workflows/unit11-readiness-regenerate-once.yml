name: Unit 11 readiness regenerate once

permissions:
  contents: write

on:
  push:
    branches:
      - codex/a1-unit11-heldout-readiness

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/a1-unit11-heldout-readiness
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild generated learning content
        run: node --experimental-strip-types --no-warnings --import ./scripts/ts-test-register.mjs scripts/build-content.ts
      - name: Rebuild coach evaluation cases
        run: npm run --silent coach:cases
      - name: Require Unit 11 machine readiness
        run: npm run --silent content:qualification -- --unit 11-health-feelings --require-ready
      - name: Commit exact generated snapshots
        shell: bash
        run: |
          git add content/compiled/enhanced.json content/coach-eval/cases.json public/data/enhanced public/data/enhanced-order.json
          if git diff --cached --quiet; then
            echo "Generated snapshots already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild Unit 11 readiness snapshots"
          git push origin HEAD:codex/a1-unit11-heldout-readiness
